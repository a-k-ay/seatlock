spring.application.name=seatlock

# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5433/seatlock
spring.datasource.username=seatlock
spring.datasource.password=seatlock

# JPA — Flyway owns the schema, JPA just validates
spring.jpa.hibernate.ddl-auto=validate

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info

# Server
server.port=8080

# JWT config
seatlock.jwt.secret=change-this-to-a-long-random-string-at-least-32-bytes-long-for-hs256
seatlock.jwt.expiration-minutes=60