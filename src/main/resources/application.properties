spring.application.name=seatlock

# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5433/seatlock
spring.datasource.username=seatlock
spring.datasource.password=seatlock

# JPA — Flyway owns the schema, JPA just validates
spring.jpa.hibernate.ddl-auto=validate

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# JWT config
seatlock.jwt.secret=change-this-to-a-long-random-string-at-least-32-bytes-long-for-hs256
seatlock.jwt.expiration-minutes=60

# Hold TTL — how long a hold stays ACTIVE before auto-expiring
seatlock.holds.ttl-minutes=8

# ==== Phase 7 — Observability: health endpoints ====
# Only expose /actuator/health publicly (Decision A: strict)
management.endpoints.web.exposure.include=health,prometheus

# Show subsystem breakdown (db, redis, diskSpace, ping) in the response
management.endpoint.health.show-details=always

# Enable /actuator/health/readiness and /actuator/health/liveness probes
management.endpoint.health.probes.enabled=true

# Readiness = UP only if DB + Redis are both reachable
# (k8s uses this to decide "route traffic to this pod")
management.endpoint.health.group.readiness.include=readinessState,db,redis

springdoc.show-actuator=true